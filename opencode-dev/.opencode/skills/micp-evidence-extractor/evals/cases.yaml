# Evaluation cases — micp-evidence-extractor

Offline, deterministic evaluation of the extraction pipeline and the skill
contract. Each case defines a JSON input and the checks that must hold after
running it through the service. The runner (`run_evals.py`) is pure stdlib,
needs no network, and reports the minimum performance indicators declared in
`skill.yaml`.

Indicator → measurement mapping:

| Indicator | Where measured |
|---|---|
| `structured_output_pass_rate` | every SUCCESS/PARTIAL case's output validates against `schemas/output.schema.json` |
| `tool_invocation_rate` | per case, real sub-tools invoked (runner calls the real CLI for each) |
| `evidence_traceability_rate` | every `evidence_used.ref_id` / card source locator is traceable to input refs |
| `missing_input_detection_rate` | cases with missing required fields must yield `BLOCKED` with `missing_inputs` |
| `adversarial_interception_rate` | adversarial cases (forged DOI, group mixing, uncalibrated figure) must be caught |
| `repeat_run_consistency` | the reference case run twice; byte-identical output required |
| `mean_failure_recovery_time` | wall time per case (stdin→result) |

---

## 1. positive/multi-group-extraction

A paper with two treatment groups and two time points. The extractor must
produce one card per table, bind every value to a declared group and time
point, and never mix them.

```json
{
  "task_id": "eval-01",
  "project_id": "panshi-demo",
  "request": "从这篇 MICP 论文提取证据卡，区分 Control 与 MICP 两组、Day 7 与 Day 14 两个时间点",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:00:00Z",
  "risk_level": "medium",
  "human_approval_state": "not_required",
  "requested_output_format": "json",
  "document": {
    "source_id": "eval-paper-1",
    "title": "MICP treatment of sand columns",
    "year": "2023",
    "document_type": "original_research",
    "sections": [
      {"kind": "methods", "heading": "Methods",
       "text": "Sporosarcina pasteurii was used. Urea 0.5 M and CaCl2 0.5 M."}
    ],
    "tables": [
      {"table_id": "t1", "caption": "UCS results",
       "header": ["Group", "Day 7 UCS (kPa)", "Day 14 UCS (kPa)"],
       "rows": [["Control", "150", "210"], ["MICP", "1200", "2500"]],
       "source_locator": "Table 1"}
    ],
    "figures": []
  }
}
```

checks:
  - `status == SUCCESS`
  - `extractor_stats.cards_built >= 1`
  - the t1 card declares groups `{Control, MICP}` and time points Day 7 / Day 14
  - every `results.ucs` quantity has both `group_id` and `timepoint_id` set to
    a declared value
  - Control values are 150/210, MICP values are 1200/2500 (never mixed)
  - `isolation_report.passed == true`

## 2. positive/od600-urease-distinct

A table with both OD600 and urease activity. The extractor must preserve them
as distinct quantities with distinct canonical units.

```json
{
  "task_id": "eval-02",
  "project_id": "panshi-demo",
  "request": "提取生物条件证据卡，OD600 与脲酶活性必须分开",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:05:00Z",
  "risk_level": "medium",
  "human_approval_state": "not_required",
  "requested_output_format": "json",
  "document": {
    "source_id": "eval-paper-2",
    "title": "Ureolytic bacteria characterization",
    "year": "2022",
    "document_type": "original_research",
    "sections": [],
    "tables": [
      {"table_id": "t1", "caption": "Biological characterization",
       "header": ["Sample", "OD600", "Urease (mM urea/min/OD)"],
       "rows": [["S. pasteurii", "1.2", "0.8"], ["Blank", "0.05", "0.0"]],
       "source_locator": "Table 1"}
    ],
    "figures": []
  }
}
```

checks:
  - `status == SUCCESS`
  - `conditions.biological.od600` present, each normalized_unit == `OD600`
  - `conditions.biological.urease_activity` present, each normalized_unit == `mmol_urea/min/OD`
  - no od600 quantity carries a cfu/cell/urease unit (conflation guard clear)
  - no card mixes the two into a single value list

## 3. positive/figure-digitized

Figure-only paper. The value must be DIGITIZED_FROM_FIGURE with a reading error
estimate, never presented as author-reported.

```json
{
  "task_id": "eval-03",
  "project_id": "panshi-demo",
  "request": "提取图中 UCS 数据，标注为图数字化",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:10:00Z",
  "risk_level": "medium",
  "human_approval_state": "not_required",
  "requested_output_format": "json",
  "document": {
    "source_id": "eval-paper-3",
    "title": "UCS from figure",
    "year": "2021",
    "document_type": "original_research",
    "sections": [],
    "tables": [],
    "figures": [
      {"figure_id": "fig1", "caption": "UCS evolution of MICP-treated specimens",
       "note": "read: 3.2; axis_px: 400; axis_range: 4.0"}
    ]
  }
}
```

checks:
  - `status == SUCCESS`
  - some quantity has `acquisition_mode == DIGITIZED_FROM_FIGURE`
  - that quantity has `digitization.error_estimate > 0`
  - the quantity's `epistemic_tag` is not OBSERVED

