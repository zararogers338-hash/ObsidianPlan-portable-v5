## 9. adversarial/corrupt-pdf

A corrupt PDF payload must be rejected with a classified error, never
fabricating content.

```json
{
  "document_text": null,
  "source_path": null,
  "media_type": "application/pdf",
  "document_text_b64": "R0FSQkFHRU5PVFBBU0Y=",
  "source_id": "eval-paper-9"
}
```

checks:
  - the adapters CLI returns a clean error envelope (exit 2, code MEE-E303)
  - no fabricated document content is produced

## 10. adversarial/group-smear

A card declares two groups but a result quantity is unbound. The isolation
check must flag it.

```json
{
  "task_id": "eval-10",
  "project_id": "panshi-demo",
  "request": "提取证据卡并检查实验组隔离",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:40:00Z",
  "risk_level": "medium",
  "human_approval_state": "not_required",
  "requested_output_format": "json",
  "document": {
    "source_id": "eval-paper-10",
    "title": "Multi-group MICP",
    "year": "2023",
    "document_type": "original_research",
    "sections": [],
    "tables": [
      {"table_id": "t1", "caption": "UCS results",
       "header": ["Specimen", "UCS (kPa)"],
       "rows": [["A1", "100"], ["A2", "200"], ["B1", "900"], ["B2", "1100"]],
       "source_locator": "Table 1"}
    ],
    "figures": []
  }
}
```

checks:
  - `status in (SUCCESS, PARTIAL)`
  - `isolation_report` is present
  - if the table's first column is treated as specimen id (not group), the
    card either binds specimen ids as groups or the isolation check reports a
    warning — never silently merges rows into one value

