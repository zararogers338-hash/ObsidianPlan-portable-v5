## 5. conflict/methods-results-contradiction

Methods say urea 0.5 M, the results table says 0.05 M. The extractor must
surface the contradiction rather than silently pick one.

```json
{
  "task_id": "eval-05",
  "project_id": "panshi-demo",
  "request": "提取条件数据并检查方法/结果矛盾",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:20:00Z",
  "risk_level": "medium",
  "human_approval_state": "not_required",
  "requested_output_format": "json",
  "document": {
    "source_id": "eval-paper-5",
    "title": "Condition recipe",
    "year": "2021",
    "document_type": "original_research",
    "sections": [
      {"kind": "methods", "heading": "Methods",
       "text": "Urea concentration 0.5 M was used."}
    ],
    "tables": [
      {"table_id": "t1", "caption": "Conditions",
       "header": ["Run", "Urea concentration (M)"],
       "rows": [["A", "0.05"], ["B", "0.05"]],
       "source_locator": "Table 1"}
    ],
    "figures": []
  }
}
```

checks:
  - `status in (SUCCESS, PARTIAL)`
  - `duplicates_contradictions` section is present
  - the contradiction between the methods text (0.5 M) and the results table
    (0.05 M) is surfaced as an issue, not silently resolved

## 6. adversarial/forged-doi

A document with a forged DOI must be flagged.

```json
{
  "task_id": "eval-06",
  "project_id": "panshi-demo",
  "request": "提取证据并核验 DOI",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:25:00Z",
  "risk_level": "medium",
  "human_approval_state": "not_required",
  "requested_output_format": "json",
  "document": {
    "source_id": "eval-paper-6",
    "title": "MICP study",
    "year": "2020",
    "doi": "10.9999/fake-article",
    "document_type": "original_research",
    "sections": [
      {"kind": "methods", "heading": "Methods", "text": "Urea 0.5 M was injected."}
    ],
    "tables": [],
    "figures": []
  }
}
```

checks:
  - `status == SUCCESS` (extraction proceeds; the DOI is flagged, not fatal)
  - `doi_verifications[0].status == suspected_forged`

