# obsidian-red-team skill manifest
#
# Consumed by the OSR registry indexer (tools/osr/registry.ts) and by Obsidian
# Controller tooling. CRITICAL: capabilities / inputs_required / outputs /
# tool_permissions / writes / stop_conditions / domain_keywords / dependencies
# must ALL be arrays of strings (an object breaks validateManifest →
# usable:false). Capabilities must carry the bare token `red_team` so the
# router's planner (DOMAIN_MAP) can route to this skill.

name: obsidian-red-team
display_name: Obsidian Red Team｜科学反证与对抗审查器
version: 1.0.0
contract_version: "1.0"
description: >-
  Mandatory adversarial audit for the Obsidian Plan / Panshi research project.
  Actively attacks conclusions across ten dimensions (source authenticity,
  epistemic escalation, units/dimension, experimental design, statistics,
  MICP mechanisms, models, engineering scale-up, environment/safety, decision)
  and emits severity-graded findings (INFO/MINOR/MAJOR/CRITICAL/BLOCKING),
  strongest counterexamples, required fixes and a state recommendation.
  Blocks state upgrades (SUPPORTED->VALIDATED->PILOT_READY->DEPLOYABLE) while
  any BLOCKING finding is open. Never mutates the audited conclusion or data.

entry:
  cli: tools/ort/cli.py
  mode: stdin_stdout

capabilities:
  - red_team
  - adversarial_review
  - citation_verification
  - evidence_chain_audit
  - unit_dimension_check
  - mass_balance_check
  - statistical_structure_check
  - pseudo_replication_detection
  - model_boundary_check
  - escalation_guard
  - permission_boundary_check
  - counterexample_generation
  - severity_scoring
  - blocking_rule_engine
  - fix_retest_verification

inputs_required:
  - task_id
  - project_id
  - request
  - skill_version
  - controller_version
  - timestamp

outputs:
  - review_report
  - blocking_findings
  - counterexamples
  - alternative_explanations
  - required_fixes
  - retest_plan
  - state_recommendation
  - audit_artifact

units:
  strength: MPa | kPa | kN/m2
  permeability: m/s | cm/s | m/d
  concentration: g/L | mg/L | mol/L | mol/m3
  ammonia_conc: mg/L | mg/m3 | ppm
  caCO3_content: mass_percent
  mass: kg | g | mg | t
  length: mm | cm | m | km
  volume: mL | L | m3
  time: s | min | h | d | a

tool_permissions:
  - read

network: false
writes:
  - audit/**

stop_conditions:
  - 输出通过 output.schema.json 自检后停止
  - 任一硬门控失败即返回 BLOCKED/FAILED 并停止
  - 存在 BLOCKING 发现即返回 BLOCKED(state_recommendation=REVIEW_FAIL/HOLD)并停止
  - 需要其他能力返回 NEED_ADDITIONAL_SKILL 并停止
  - 高风险待批准返回 HUMAN_APPROVAL_REQUIRED 并停止

compatible_controller: ">=1.0.0"
dependencies: []
cost_estimate:
  tokens: 3500
  usd: 0.035

risk_tier: critical

domain_keywords:
  - red_team
  - red team
  - 红队
  - 对抗
  - 攻击
  - 挑刺
  - 反证
  - 审查
  - 审稿
  - audit
  - adversarial
  - 反例
  - 升级门
  - BLOCKING
  - 阻断
  - counterexample
