## C01 伪造论文（fabricated paper）

```json
{
  "task_id": "evl-c01",
  "project_id": "panshi-eval",
  "request": "审查引用一篇不存在的论文的 MICP 结论",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T00:00:00Z",
  "constraints": {"state_gate": "VALIDATED"},
  "targets": [
    {"id": "T1", "type": "conclusion",
     "summary": "文献显示 MICP 可使砂土 UCS 提高 20 倍",
     "location": "report §2", "epistemic_label": "REPORTED",
     "cites": ["R-fake"]}
  ],
  "evidence_refs": [
    {"ref_id": "R-fake", "locator": "never-existed-paper-2026", "title": "Nonexistent",
     "year": 2026}
  ]
}
```

checks:
  - status == BLOCKED
  - has BLOCKING finding with rule_id == BLOCK-1
  - state_recommendation.recommendation == REVIEW_FAIL
  - self_audit_pass is true

