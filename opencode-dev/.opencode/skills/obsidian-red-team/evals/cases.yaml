## C05 多个测点被当作独立试样（pseudo-replication）

```json
{
  "task_id": "evl-c05",
  "project_id": "panshi-eval",
  "request": "审查把同一砂柱多个测点当作独立试样的统计分析",
  "skill_version": "1.0.0",
  "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T00:00:00Z",
  "constraints": {"state_gate": "VALIDATED"},
  "samples": [
    {"specimen": "A1", "pos": "top", "ucs": 3.0},
    {"specimen": "A1", "pos": "mid", "ucs": 3.4},
    {"specimen": "A1", "pos": "bot", "ucs": 3.8},
    {"specimen": "A2", "pos": "top", "ucs": 3.2},
    {"specimen": "A2", "pos": "mid", "ucs": 3.5},
    {"specimen": "A2", "pos": "bot", "ucs": 3.9}
  ],
  "data_columns": [
    {"name": "specimen", "role": "id", "sampling_unit": "column"},
    {"name": "pos", "role": "position"}
  ],
  "targets": [
    {"id": "T1", "type": "analysis",
     "summary": "两组数据差异显著，p=0.01，n=6 独立样本",
     "location": "stats.xlsx", "epistemic_label": "INFERRED",
     "analysis": {"p_value": 0.01, "effect_size": 1.2, "effect_type": "cohens_d",
                  "n_independent": 6, "n_rows": 6}}
  ]
}
```

checks:
  - pseudo tool reports effective_n == 2 and detected true
  - has CRITICAL or BLOCKING finding in experimental_design / statistical_analysis
  - because the analysis reports n==rows with a significance claim, the finding
    must be BLOCKING (rule BLOCK-5) and state_recommendation == REVIEW_FAIL

