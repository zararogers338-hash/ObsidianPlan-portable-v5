# Evaluation cases — obsidian-red-team (15 mandatory adversarial cases)

Offline, deterministic evaluation. Each case defines a review request and the
checks that must hold after running it through the service. The runner
(`run_evals.py`) is pure stdlib and reports the seven indicators declared in
`skill.yaml` (M1–M7).

## Indicator mapping

| Indicator | Where measured |
|---|---|
| M1 structured_output_pass_rate | every SUCCESS/PARTIAL output validates against `schemas/output.schema.json` |
| M2 tool_invocation_rate | per case, the runner calls the real CLI (`review`) — never faked |
| M3 evidence_traceability_rate | every `evidence_used.ref_id` in outputs exists in input refs |
| M4 missing_input_detection_rate | missing-required-field cases must yield BLOCKED/ORT-E### with field guidance |
| M5 adversarial_interception_rate | all 15 adversarial cases must be intercepted (BLOCKING detected where engineered) |
| M6 repeat_run_consistency | each case run twice; findings/state_recommendation byte-identical |
| M7 mean_failure_recovery_time | wall time per case (stdin→result); reported as max and mean |

