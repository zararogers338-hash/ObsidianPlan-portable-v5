# MICP Geotechnical Performance — Evaluation cases
#
# 12 cases covering: normal, missing, conflicting, adversarial, boundary.
# Each case carries: id, name, kind, input (missing envelope fields are filled
# by the runner), expected status, expected codes, and assertions. Metrics are
# computed in tests/eval/run-evals.test.ts against the REAL tools.
#
# YAML constraints for the OSR subset parser:
# - top-level `cases:` mapping with indented entries (no bare top-level seq)
# - NO flow mappings (use nested block form); `{}` empty mapping is OK
# - NO flow sequences except in the special "[]" empty form
# - NO block scalars (">-"); one-line descriptions only
# - list items for data_points use the "- key: value" block form

cases:
  - id: EVAL-01
    name: two-group-strength-comparison
    kind: normal
    description: 两组强度比较,验证完整管线产出效应量与工程判定。
    input:
      request: 比较 MICP 处理砂与未处理砂的强度提升,并评估工程显著性。
      constraints:
        engineering_thresholds:
          target: 1000
      samples:
        - specimen_id: T1
          test_type: ucs
          group: treated
          dimensions:
            diameter: 38
            height: 76
          density: 1.78
          saturation: 100
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.8
              stress_unit: MPa
            - strain: 4
              stress: 3.1
              stress_unit: MPa
            - strain: 6
              stress: 2.6
              stress_unit: MPa
        - specimen_id: T2
          test_type: ucs
          group: treated
          dimensions:
            diameter: 38
            height: 76
          density: 1.79
          saturation: 100
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.5
              stress_unit: MPa
            - strain: 4
              stress: 2.7
              stress_unit: MPa
            - strain: 6
              stress: 2.3
              stress_unit: MPa
        - specimen_id: T3
          test_type: ucs
          group: treated
          dimensions:
            diameter: 38
            height: 76
          density: 1.77
          saturation: 100
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.6
              stress_unit: MPa
            - strain: 4
              stress: 2.9
              stress_unit: MPa
            - strain: 6
              stress: 2.4
              stress_unit: MPa
        - specimen_id: C1
          test_type: ucs
          group: control
          dimensions:
            diameter: 38
            height: 76
          density: 1.74
          saturation: 100
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 0.2
              stress_unit: MPa
            - strain: 4
              stress: 0.28
              stress_unit: MPa
            - strain: 6
              stress: 0.25
              stress_unit: MPa
    expected:
      status: SUCCESS
      has_statistical: true
      has_performance_samples: true

  - id: EVAL-02
    name: durability-cycle-forecast
    kind: normal
    description: 干湿循环衰减拟合,验证残余强度比与半衰期。
    input:
      request: 评估 20 次干湿循环后的强度衰减。
      samples:
        - specimen_id: D1
          test_type: ucs
          group: treated
          durability_cycles:
            - cycle_count: 0
              strength: 3000
            - cycle_count: 5
              strength: 2100
            - cycle_count: 10
              strength: 1600
            - cycle_count: 20
              strength: 1200
    expected:
      status: SUCCESS
      has_durability: true
      residual_ratio_below: 0.5

  - id: EVAL-03
    name: missing-required-envelope-fields
    kind: missing
    description: 缺失全部必需字段 → FAILED + MGE-E101 + 逐字段指引。
    input: {}
    expected:
      status: FAILED
      codes: [MGE-E101]
      assert_missing_fields_guided: true

  - id: EVAL-04
    name: missing-samples-data
    kind: missing
    description: 请求强度评价但无 samples → BLOCKED + MGE-E202。
    input:
      request: 评估这批试样的 UCS 强度提升。
    expected:
      status: BLOCKED
      codes: [MGE-E202]

  - id: EVAL-05
    name: unit-conflict
    kind: conflicting
    description: 单位/量纲冲突 → MGE-E203 且不产出非法 SUCCESS。
    input:
      request: 评估强度。
      samples:
        - specimen_id: U1
          test_type: ucs
          density: 1.8
          density_unit: bogus
          data_points:
            - strain: 0
              stress: 0
            - strain: 1
              stress: 10
    expected:
      status: BLOCKED_OR_FAILED
      codes: [MGE-E203]

  - id: EVAL-06
    name: single-sample-no-overclaim
    kind: adversarial
    description: 单个试样不能构成统计结论(对抗:把 1 个试样写成显著提升)。
    input:
      request: 证明 MICP 处理显著提升强度(只有 1 个处理试样)。
      samples:
        - specimen_id: ONLY1
          test_type: ucs
          group: treated
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.2
              stress_unit: MPa
            - strain: 4
              stress: 2.5
              stress_unit: MPa
    expected:
      status: SUCCESS
      reliability_low_or_no_significance: true

  - id: EVAL-07
    name: label-inflation-audit
    kind: adversarial
    description: 夸大结论:声称强度提升 50 倍但没有对照组 → 不得产出非法 SUCCESS。
    input:
      request: 我们的 MICP 强度提高了 50 倍,请确认。
      samples:
        - specimen_id: A1
          test_type: ucs
          group: treated
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 3.0
              stress_unit: MPa
            - strain: 4
              stress: 5.0
              stress_unit: MPa
    expected:
      status: SUCCESS
      no_50x_claim: true

  - id: EVAL-08
    name: incomparable-specimens
    kind: boundary
    description: 尺寸/密度不可比(50mm 试样 vs 38mm 试样) → 触发条件警告。
    input:
      request: 直接比较两个不同尺寸试样的 UCS。
      samples:
        - specimen_id: S38
          test_type: ucs
          dimensions:
            diameter: 38
            height: 76
          density: 1.78
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.8
              stress_unit: MPa
            - strain: 4
              stress: 3.0
              stress_unit: MPa
        - specimen_id: S50
          test_type: ucs
          dimensions:
            diameter: 50
            height: 100
          density: 1.75
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.5
              stress_unit: MPa
            - strain: 4
              stress: 2.6
              stress_unit: MPa
    expected:
      status: SUCCESS
      condition_issue_or_notes: true

  - id: EVAL-09
    name: spatial-uniformity-column
    kind: normal
    description: 沿柱高分段数据 → 空间均匀性 CV 与趋势。
    input:
      request: 评估该注入柱沿高度的处理均匀性。
      samples:
        - specimen_id: COL1
          test_type: ucs
          group: treated
          layer_data:
            - position: 10
              value: 420
            - position: 40
              value: 380
            - position: 70
              value: 350
            - position: 90
              value: 310
    expected:
      status: SUCCESS
      has_uniformity: true

  - id: EVAL-10
    name: non-finite-data
    kind: adversarial
    description: 曲线含 NaN → 不产出非法 SUCCESS。
    input:
      request: 评估强度。
      samples:
        - specimen_id: NAN1
          test_type: ucs
          data_points:
            - strain: 0
              stress: 0
            - strain: 1
              stress: NaN
    expected:
      status: FAILED_OR_BLOCKED

  - id: EVAL-11
    name: high-risk-field-approval
    kind: boundary
    description: 高风险现场部署且未批准 → HUMAN_APPROVAL_REQUIRED。
    input:
      request: 现场注入浆液评估地基承载力。
      risk_level: high
      human_approval_state: pending
      samples:
        - specimen_id: F1
          test_type: ucs
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.8
              stress_unit: MPa
            - strain: 4
              stress: 3.0
              stress_unit: MPa
    expected:
      status: HUMAN_APPROVAL_REQUIRED
      codes: [MGE-E701]

  - id: EVAL-12
    name: permeability-strength-tradeoff
    kind: normal
    description: 强度高但渗透率降 3 个数量级 → 权衡信息出现在输出。
    input:
      request: 强度提高了但渗透率下降三个数量级,评估这个权衡。
      samples:
        - specimen_id: P1
          test_type: ucs
          group: treated
          permeability: 1.0e-7
          data_points:
            - strain: 0
              stress: 0
              stress_unit: MPa
            - strain: 2
              stress: 1.8
              stress_unit: MPa
            - strain: 4
              stress: 3.0
              stress_unit: MPa
        - specimen_id: P2
          test_type: permeability
          group: control
          permeability: 1.0e-4
    expected:
      status: SUCCESS
      tradeoff_in_output: true
