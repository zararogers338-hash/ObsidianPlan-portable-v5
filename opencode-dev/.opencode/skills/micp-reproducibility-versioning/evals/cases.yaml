  - `missing_inputs` names `previous_manifest`

## 9. adversarial/writable-raw

Writable data/raw must be intercepted (BLOCKED / MRV-E501).

```json
{
  "task_id": "eval-09", "project_id": "panshi-demo",
  "request": "复现并检查原始数据是否可写",
  "action": "reproduce",
  "root": "EVAL_WRITABLE_ROOT",
  "commands": [{"id": "noop", "cmd": "python -c \"pass\"", "cwd": ".",
                "expected_outputs": []}],
  "constraints": {"timeout_sec": 30},
  "skill_version": "1.0.0", "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:40:00Z", "risk_level": "low",
  "human_approval_state": "not_required"
}
```

checks:
  - `status == BLOCKED`
  - `errors[0].code == MRV-E501` (raw write protection breach)

## 10. adversarial/path-escape

A target path escaping the governance root must be rejected.

```json
{
  "task_id": "eval-10", "project_id": "panshi-demo",
  "request": "生成清单，包含越界路径",
  "action": "manifest",
  "root": "SANDBOX_ROOT",
  "targets": ["../escape"],
  "skill_version": "1.0.0", "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:45:00Z", "risk_level": "low",
  "human_approval_state": "not_required"
}
```

checks:
  - tool returns a clean error envelope with code `MRV-E302` (never a traceback)
  - status is BLOCKED/FAILED, not SUCCESS

## 11. adversarial/fabricated-version

Declaring an incompatible skill major must be rejected at the version gate.

```json
{
  "task_id": "eval-11", "project_id": "panshi-demo",
  "request": "采集环境信息",
  "action": "env",
  "root": "SANDBOX_ROOT",
  "skill_version": "2.0.0", "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:50:00Z", "risk_level": "low",
  "human_approval_state": "not_required"
}
```

checks:
  - `status == BLOCKED`
  - `errors[0].code == MRV-E801`
  - no environment data fabricated (no `environment.os` on BLOCKED)

## 12. adversarial/pollution-after-overwrite

After a reproduction baseline, a manual overwrite of a hashed output must be
detected by check-pollution.

```json
{
  "task_id": "eval-12", "project_id": "panshi-demo",
  "request": "检测产物污染：手工覆盖后应报警",
  "action": "check-pollution",
  "root": "EVAL_POLLUTED_ROOT",
  "skill_version": "1.0.0", "controller_version": "obsidian-ctl-0.1.0",
  "timestamp": "2026-08-07T09:55:00Z", "risk_level": "low",
  "human_approval_state": "not_required"
}
```

checks:
  - `status == SUCCESS` (the tool reports findings; it does not crash)
  - `verdict == "pollution_detected"`
  - a finding with `kind == "manifest_mismatch"` names `data/processed/summary.csv`
