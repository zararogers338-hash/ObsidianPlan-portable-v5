  - pytest
  - pyyaml
dependencies_detail:
  runtime: "python3 (>= 3.10)"
  libs: []
  network: none
permissions:
  filesystem: []
  approvals_required:
    - field.deployment
    - cost.commit
    - environmental.claim
  dry_run: true
compatibility:
  opencode_loader: "discovery pattern {skill,skills}/**/SKILL.md; frontmatter name+description (verified in packages/opencode/src/skill/index.ts)"
  contract_major: 1
  schema_breaking_bump: major
  optional_field_bump: minor
  implementation_fix_bump: patch
  migrate_or_reject: Outputs written under an older major contract are either migrated by an explicit migration step or rejected with LCA-E802; never silently reinterpreted.
maintainer: Panshi / Obsidian Plan
