name: obsidian-mission-lock
title: "Obsidian Mission Lock | 研究任务定界与使命锁定"
version: 1.0.0
contract_version: 1.0.0
layer: panshi-governed-capability
license: MIT
compatibility:
  opencode: ">=1.18"
  runtime: "bun >=1.3"
  node: ">=18"
description: "Research task delimitation and mission locking (研究任务定界与使命锁定). Load when a vague natural-language research or engineering request — especially MICP / biocementation / mineral-intelligence work under the Panshi research core — must be converted into an executable, verifiable, terminable, auditable mission contract; when requirements conflict and a conflict matrix is needed; when an existing contract must be diffed for scope drift or objective substitution. Do NOT load for answering domain science questions directly, running experiments, or decomposing an already-locked contract into subtasks."
entrypoint: tools/src/cli.ts
entry:
  cli: tools/src/cli.ts
  mode: stdin_stdout
inputs:
  schema: schemas/input.schema.json
outputs:
  - "schema: schemas/output.schema.json"
  - "statuses: SUCCESS"
  - "statuses: PARTIAL"
  - "statuses: BLOCKED"
  - "statuses: FAILED"
  - "statuses: NEED_ADDITIONAL_SKILL"
  - "statuses: HUMAN_APPROVAL_REQUIRED"
discovery:
  format: SKILL.md
  locations:
    - .opencode/skills/
    - .claude/skills/
    - .agents/skills/
tools:
  lock: "tools/src/cli.ts — Full pipeline: envelope validation, missing-field & conflict detection, unit check, contract schema validation, approval gating"
  validate: tools/src/cli.ts — Validate a contract JSON against contract schema + unit check
  diff: tools/src/cli.ts — Diff two contract versions; goal-drift / objective-substitution detection
  units: tools/src/cli.ts — Unit / scale / temporal consistency check on a contract
errors:
  - OML-E1001
  - OML-E1002
  - OML-E1003
  - OML-E1004
  - OML-E1005
  - OML-E1006
  - OML-E1007
  - OML-E1008
  - OML-E1009
  - OML-E1010
permissions:
  read: project files (read-only)
  write: audit/ directory only
  approvals_required:
    - network access
    - external writes
    - experiment execution
    - invoking other skills
offline: true
deterministic: true
outputs_detail:
  schema: schemas/output.schema.json
  statuses:
    - SUCCESS
    - PARTIAL
    - BLOCKED
    - FAILED
    - NEED_ADDITIONAL_SKILL
    - HUMAN_APPROVAL_REQUIRED
