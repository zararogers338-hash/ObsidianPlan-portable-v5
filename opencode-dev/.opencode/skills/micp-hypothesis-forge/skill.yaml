schema_version: 1.0
name: micp-hypothesis-forge
display_name: MICP Hypothesis Forge
version: 1.0.0
license: MIT
description: "Forge falsifiable, measurable mechanism hypotheses for MICP — one main plus competing hypotheses with refutation conditions, observable variables, time scales, scope, evidence, and a discriminating-experiment matrix — as a governed professional skill of Obsidian Plan (Panshi), controller-invoked."
kind: mechanism_reasoning
governance:
  constitution: panshi-constitution
  controller: obsidian-controller
  self_invokes_other_skills: false
  human_approval_gate: enforced
compatibility:
  opencode:
    min: 0.1.0
  python:
    min: 3.10
  runtimes:
    - python3
  offline: true
  os:
    - windows
    - linux
    - macos
dependencies:
  - "toolset_version: 1.0.0"
permissions:
  network: false
  filesystem_write: false
  long_term_memory_write: false
  external_commands: false
entry_points:
  dag:
    command: python
    args:
      - tools/dag.py
  scoring:
    command: python
    args:
      - tools/scoring.py
  card_validate:
    command: python
    args:
      - tools/card-validate.py
  competing_matrix:
    command: python
    args:
      - tools/competing-matrix.py
  experiment_priority:
    command: python
    args:
      - tools/experiment-priority.py
  self_audit:
    command: python
    args:
      - tools/self-audit.py
schemas:
  input: schemas/input.schema.json
  output: schemas/output.schema.json
  hypothesis_card: schemas/hypothesis-card.schema.json
  card_set: schemas/card-set.schema.json
version_policy:
  major: "Breaking contract changes: removing or renaming required input/output fields, changing the status enum, renumbering error codes, changing a tool's exit-code contract."
  minor: "Additive contract changes: new optional fields, new enum values, new tools, new optional schema keywords. Old documents remain valid."
  patch: Implementation fixes that preserve every contract exactly (no schema/field/exit-code change).
  migration:
    - "When the controller sees an artifact carrying provenance.skill_version whose MAJOR differs from the installed skill's MAJOR, it MUST NOT feed it straight into a downstream skill; it either requests regeneration under the new contract or applies the documented conversion in CHANGELOG.md (v2 migration notes, when they exist)."
    - "When MAJOR matches but MINOR differs, older documents remain valid (additive-only contract); downstream consumption may proceed."
  rejection: MHX-E801 (provenance.skill_version vs installed 1.0.0) is reported in provenance and errors; the request is not fabricated around.
evaluation:
  indicators:
    - name: structured_output_pass_rate
      min_threshold: 1
      unit: ratio
      measurement: evals/run_evals.py — every case output validates against output.schema.json
    - name: tool_invocation_rate
      min_threshold: 1
      unit: ratio
      measurement: agent must invoke at least 3 distinct tools per SUCCESS case; recorded in case logs
    - name: evidence_traceability_rate
      min_threshold: 1
      unit: ratio
      measurement: every evidence_used.ref_id exists in input evidence_refs/upstream_outputs
    - name: missing_input_detection_rate
      min_threshold: 1
      unit: ratio
      measurement: cases with missing required fields must return BLOCKED with missing_inputs
    - name: adversarial_interception_rate
      min_threshold: 1
      unit: ratio
      measurement: "adversarial cases (cycles, unfalsifiable statements, fabricated refs) must be caught"
    - name: repeat_run_consistency
      min_threshold: 1
      unit: ratio
      measurement: "deterministic tools: two runs on identical input produce identical output"
    - name: mean_failure_recovery_time
      min_threshold: 60
      unit: seconds
      measurement: "stdin-to-result wall time across all evals, worst case"
dependencies_detail:
  runtime: []
  toolset_version: 1.0.0
