              - {name: "control", n: 6, mean: 0.4, sd: 0.1, unit: "MPa"}
          risk_of_bias: {overall: low}
    assertions:
      - "status == SUCCESS"
      - "synthesis.comparability_check.status != 'incomparable'"
      - "synthesis.meta_analysis is not None"

