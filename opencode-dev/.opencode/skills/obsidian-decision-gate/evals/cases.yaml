# obsidian-decision-gate evaluation cases.
# Each case is a full input envelope plus expected verdict. The runner drives
# the real CLI (tools/odg/cli.py service) over each case and computes the
# project-standard M1..M7 metrics.

# M1 structured-output pass rate      — envelope conforms to output.schema.json
# M2 tool real-invocation rate         — the service subcommand actually ran
# M3 traceability rate                 — every blocking item cites its evidence
# M4 missing-input identification      — schema-violating inputs are caught with ODG-E101
# M5 adversarial interception rate     — illegal jumps / fudge attempts blocked
# M6 repeatability                     — same input -> identical verdict
# M7 failure-recovery time             — BLOCKED/FAILED envelopes return fast

